# Backstage descriptors for bwvgrassia/clients (fork of bitwarden/clients).
# Place at the repo root as `catalog-info.yaml`.
# The `bitwarden-password-manager` System is defined in the server repo's file.
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: bitwarden-web
  title: Bitwarden Web Vault
  description: Browser-based web vault (Angular)
  annotations:
    # CI/CD tab (GitHub Actions plugin) reads runs from upstream; forks have Actions disabled
    github.com/project-slug: bitwarden/clients
    backstage.io/source-location: url:https://github.com/bwvgrassia/clients/tree/main/apps/web/
  tags: [typescript, angular, client]
spec:
  type: website
  lifecycle: production
  owner: group:default/bitwarden-poc
  system: bitwarden-password-manager
---
